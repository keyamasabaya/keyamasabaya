<g filter="url(#c)"><rect x="8" y="8" width="844" height="240" rx="22" fill="#0d1117"/><rect x="8" y="8" width="844" height="240" rx="22" fill="none" stroke="#1b2432" stroke-opacity="0.7"/></g>
<circle cx="32" cy="34" r="5" fill="#bd00ff"/>
<text x="48" y="34" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="17" font-weight="700" fill="#c9d1d9" dominant-baseline="central"><tspan fill="#6e7a8a">// </tspan>disclosure policy — how I report</text><g transform="translate(26,73)"><path d="M2 6l3.4 3.4L11 2" fill="none" stroke="#00e5ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="52" y="79" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14.5" fill="#c9d1d9" dominant-baseline="central">Reports written in English or French, per the program policy.</text><g transform="translate(26,107)"><path d="M2 6l3.4 3.4L11 2" fill="none" stroke="#bd00ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="52" y="113" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14.5" fill="#c9d1d9" dominant-baseline="central">Encrypted communication available via PGP.</text><g transform="translate(26,141)"><path d="M2 6l3.4 3.4L11 2" fill="none" stroke="#00e5ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="52" y="147" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14.5" fill="#c9d1d9" dominant-baseline="central">No exploitation beyond the minimum required for proof of concept.</text><g transform="translate(26,175)"><path d="M2 6l3.4 3.4L11 2" fill="none" stroke="#bd00ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="52" y="181" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14.5" fill="#c9d1d9" dominant-baseline="central">Strict adherence to scope, rules of engagement &amp; disclosure timelines.</text><g transform="translate(26,209)"><path d="M2 6l3.4 3.4L11 2" fill="none" stroke="#00e5ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="52" y="215" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14.5" fill="#c9d1d9" dominant-baseline="central">No public disclosure until the fix is deployed &amp; coordinated with the vendor.</text>
</svg>
<text x="40" y="30" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="16" font-weight="700" fill="#c9d1d9" dominant-baseline="central"><tspan fill="#8b98a9">// </tspan>disclosure policy — how I report</text><g transform="translate(20,65.5)"><path d="M2 7l3.6 3.6L12 2" fill="none" stroke="#00e5ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="46" y="72.5" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14" fill="#c9d1d9" dominant-baseline="central">Reports written in English or French, per the program policy.</text><g transform="translate(20,98.5)"><path d="M2 7l3.6 3.6L12 2" fill="none" stroke="#bd00ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="46" y="105.5" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14" fill="#c9d1d9" dominant-baseline="central">Encrypted communication available via PGP.</text><g transform="translate(20,131.5)"><path d="M2 7l3.6 3.6L12 2" fill="none" stroke="#00e5ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="46" y="138.5" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14" fill="#c9d1d9" dominant-baseline="central">No exploitation beyond the minimum required for proof of concept.</text><g transform="translate(20,164.5)"><path d="M2 7l3.6 3.6L12 2" fill="none" stroke="#bd00ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="46" y="171.5" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14" fill="#c9d1d9" dominant-baseline="central">Strict adherence to scope, rules of engagement &amp; disclosure timelines.</text><g transform="translate(20,197.5)"><path d="M2 7l3.6 3.6L12 2" fill="none" stroke="#00e5ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="46" y="204.5" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14" fill="#c9d1d9" dominant-baseline="central">No public disclosure until the fix is deployed &amp; coordinated.</text>
